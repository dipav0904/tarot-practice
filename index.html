
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Комментарии к Таро</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body 
    
<div id="tarotLogin" style="margin:20px 0;padding:15px;background:#f7f3f8;border-radius:12px;">
  <h2>🔐 Вход таролога</h2>
  <input id="loginPassword" type="password" placeholder="Пароль таролога" autocomplete="current-password">
  <button id="loginButton" type="button">Войти</button>
  <p id="loginStatus"></p>
</div>

<details id="tarotAdmin" style="display:none;margin:20px 0;padding:15px;background:#f7f3f8;border-radius:12px;">
  <summary style="cursor:pointer;font-weight:bold;">🔮 Режим таролога</summary>
  <p>Вы вошли в режим таролога.</p>
  <label for="replyCommentId">Номер комментария</label>
  <input id="replyCommentId" type="number" min="1" placeholder="Например, 5">
  <label for="tarotReply">Ваше послание</label>
  <textarea id="tarotReply" maxlength="3000" placeholder="Напишите трактовку карты Таро..."></textarea>
  <button id="publishReply" type="button">Опубликовать послание</button>
  <p id="replyStatus"></p>
</details>
    {
      margin: 0;
      padding: 20px;
      background: #f7f3f8;
      color: #30283a;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
    }
    h1 { font-size: 24px; }
    textarea, input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd2e5;
      border-radius: 10px;
      font: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #69468a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .comment {
      border-bottom: 1px solid #eee6f1;
      padding: 14px 0;
      overflow-wrap: anywhere;
    }
    .author { font-weight: bold; }
    .date { color: #817889; font-size: 12px; margin-top: 5px; }
    .reply {
      margin-top: 12px;
      padding: 12px;
      background: #f7f0fb;
      border-left: 3px solid #69468a;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .reply-title {
      font-weight: bold;
      margin-bottom: 6px;
      color: #69468a;
    }
    #status { margin: 12px 0; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Комментарии 🔮</h1>
  <p>Обсуждаем публикацию и делимся мнениями.</p>

  <form id="commentForm">
    <input id="author" maxlength="60"
      placeholder="Ваше имя" required>
    <textarea id="content" maxlength="3000"
      placeholder="Напишите комментарий..." required></textarea>
    <button type="submit">Отправить комментарий</button>
  </form>

  <p id="status"></p>
  <details id="tarotAdmin" style="margin:20px 0;padding:15px;background:#f7f3f8;border-radius:12px;">
  <summary style="cursor:pointer;font-weight:bold;">🔐 Ответ таролога</summary>

  <p>Введите секретный пароль, чтобы опубликовать послание.</p>

  <input id="adminSecret" type="password" placeholder="Секретный пароль">

  <label for="replyCommentId">Номер комментария</label>
  <input id="replyCommentId" type="number" min="1" placeholder="Например, 5">

  <label for="tarotReply">Ваше послание</label>
  <textarea id="tarotReply" maxlength="3000" placeholder="Напишите трактовку карты Таро..."></textarea>

  <button id="publishReply" type="button">Опубликовать послание</button>
  <p id="replyStatus"></p>
</details>
  <h2>Обсуждение</h2>
  <div id="comments">Загрузка комментариев…</div>
</main>

<script>
  const SUPABASE_URL = "https://qptozhwwepdpaffiqgzi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MAKFTq7Nx92CutxSMCI3Cg_2ALdfsB_";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const params = new URLSearchParams(window.location.search);
  const postId = params.get("post_id") || "test";
  const status = document.getElementById("status");
  const list = document.getElementById("comments");
  const form = document.getElementById("commentForm");

  async function loadComments() {
    const { data, error } = await db
      .from("comments")
      .select("id, author_name, content, created_at, reply, replied_at")
      .eq("post_id", postId)
      .order("created_at", { ascending: true });

    if (error) {
      list.textContent =
        "Не удалось загрузить комментарии. Проверьте настройки доступа.";
      console.error(error);
      return;
    }

    list.replaceChildren();

    if (!data.length) {
      list.textContent = "Пока нет комментариев. Будьте первым!";
      return;
    }

    data.forEach(item => {
      const block = document.createElement("div");
      block.className = "comment";

      const author = document.createElement("div");
      author.className = "author";
      author.textContent = item.author_name;

      const content = document.createElement("div");
      content.textContent = item.content;

      const date = document.createElement("div");
      date.className = "date";
      date.textContent =
        new Date(item.created_at).toLocaleString("ru-RU");

      block.append(author, content, date);

      if (item.reply) {
        const reply = document.createElement("div");
        reply.className = "reply";

        const title = document.createElement("div");
        title.className = "reply-title";
        title.textContent = "🔮 Послание от Таро";

        const text = document.createElement("div");
        text.textContent = item.reply;

        reply.append(title, text);

        if (item.replied_at) {
          const replyDate = document.createElement("div");
          replyDate.className = "date";
          replyDate.textContent =
            "Ответ опубликован: " +
            new Date(item.replied_at).toLocaleString("ru-RU");
          reply.append(replyDate);
        }

        block.append(reply);
      }

      list.appendChild(block);
    });
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    status.textContent = "Отправляем…";

    const author = document.getElementById("author").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!author || !content) {
      status.textContent = "Заполните оба поля.";
      return;
    }

    const { error } = await db.from("comments").insert({
      post_id: postId,
      author_name: author,
      content: content
    });

    if (error) {
      status.textContent =
        "Не удалось отправить комментарий. Проверьте настройки доступа.";
      console.error(error);
      return;
    }

    form.reset();
    status.textContent = "Комментарий опубликован!";
    await loadComments();
  });

  loadComments();
  
  
  const loginBox = document.getElementById("tarotLogin");
  const adminBox = document.getElementById("tarotAdmin");
  const loginStatus = document.getElementById("loginStatus");
  const SESSION_KEY = "tarot_admin_session";

  function showAdminMode() {
    loginBox.style.display = "none";
    adminBox.style.display = "block";
  }
  document.getElementById("loginButton").addEventListener("click", async () => {
    const password = document.getElementById("loginPassword").value;
    loginStatus.textContent = "Проверяем пароль…";

    try {
      const response = await fetch(
        "https://qptozhwwepdpaffiqgzi.supabase.co/functions/v1/admin-login",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ password })
        }
      );

      const result = await response.json();

      if (!response.ok || !result.token) {
        throw new Error(result.message || "Не удалось войти.");
      }

      localStorage.setItem(SESSION_KEY, result.token);
      document.getElementById("loginPassword").value = "";
      loginStatus.textContent = "Вход выполнен!";
      showAdminMode();
    } catch (error) {
      loginStatus.textContent = error.message || "Ошибка входа.";
    }
  });  if (localStorage.getItem(SESSION_KEY)) {
    showAdminMode();
  }

  document.getElementById("loginButton").addEventListener("click", async () => {
    const password = document.getElementById("loginPassword").value;
    loginStatus.textContent = "Проверяем пароль…";

    try {
      const response = await fetch(
        "https://qptozhwwepdpaffiqgzi.supabase.co/functions/v1/admin-login",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ password })
        }
      );

      const result = await response.json();

      if (!response.ok || !result.token) {
        throw new Error(result.message || "Не удалось войти.");
      }

      localStorage.setItem(SESSION_KEY, result.token);
      document.getElementById("loginPassword").value = "";
      loginStatus.textContent = "Вход выполнен!";
      showAdminMode();
    } catch (error) {
      loginStatus.textContent = error.message || "Ошибка входа.";
    }
  });

  document.getElementById("publishReply").addEventListener("click", async () => {
    const commentId = document.getElementById("replyCommentId").value.trim();
    const reply = document.getElementById("tarotReply").value.trim();
    const replyStatus = document.getElementById("replyStatus");
    const publishButton = document.getElementById("publishReply");
    const token = localStorage.getItem(SESSION_KEY);

    if (!token) {
      adminBox.style.display = "none";
      loginBox.style.display = "block";
      loginStatus.textContent = "Войдите в режим таролога.";
      return;
    }

    if (!commentId || !reply) {
      replyStatus.textContent = "Укажите номер комментария и текст послания.";
      return;
    }

    publishButton.disabled = true;
    replyStatus.textContent = "Публикуем послание…";

    try {
      const response = await fetch(
        "https://qptozhwwepdpaffiqgzi.supabase.co/functions/v1/admin-reply",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            id: Number(commentId),
            reply
          })
        }
      );

      const result = await response.json();

      if (response.status === 401) {
        localStorage.removeItem(SESSION_KEY);
        adminBox.style.display = "none";
        loginBox.style.display = "block";
        loginStatus.textContent = "Сессия недействительна. Войдите снова.";
        throw new Error("Пожалуйста, войдите снова.");
      }

      if (!response.ok) {
        throw new Error(result.message || "Не удалось опубликовать ответ.");
      }

      replyStatus.textContent = "Послание опубликовано!";
      document.getElementById("tarotReply").value = "";
      await loadComments();
    } catch (error) {
      replyStatus.textContent = error.message || "Ошибка публикации.";
    } finally {
      publishButton.disabled = false;
    }
  });

</script>
</body>
</html>
