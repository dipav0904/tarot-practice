
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Комментарии к Таро</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f7f3f8;
      color: #30283a;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
    }
    h1 { font-size: 24px; }
    textarea, input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd2e5;
      border-radius: 10px;
      font: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #69468a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .comment {
      border-bottom: 1px solid #eee6f1;
      padding: 14px 0;
      overflow-wrap: anywhere;
    }
    .author { font-weight: bold; }
    .date { color: #817889; font-size: 12px; margin-top: 5px; }
    #status { margin: 12px 0; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Комментарии 🔮</h1>
  <p>Обсуждаем публикацию и делимся мнениями.</p>

  <form id="commentForm">
    <input id="author" maxlength="60" placeholder="Ваше имя" required>
    <textarea id="content" maxlength="3000"
      placeholder="Напишите комментарий..." required></textarea>
    <button type="submit">Отправить комментарий</button>
  </form>

  <p id="status"></p>
  <h2>Обсуждение</h2>
  <div id="comments">Загрузка комментариев…</div>
</main>

<script>
  const SUPABASE_URL = "https://qptozhwwepdpaffiqgzi.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MAKFTq7Nx92CutxSMCI3Cg_2ALdfsB_";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const params = new URLSearchParams(window.location.search);
  const postId = params.get("post_id") || "test";
  const status = document.getElementById("status");
  const list = document.getElementById("comments");
  const form = document.getElementById("commentForm");

  async function loadComments() {
    const { data, error } = await db
      .from("comments")
      .select("author_name, content, created_at")
      .eq("post_id", postId)
      .order("created_at", { ascending: true });

    if (error) {
      list.textContent = "Не удалось загрузить комментарии. Проверьте настройки доступа.";
      console.error(error);
      return;
    }

    list.replaceChildren();

    if (!data.length) {
      list.textContent = "Пока нет комментариев. Будьте первым!";
      return;
    }

    data.forEach(item => {
      const block = document.createElement("div");
      block.className = "comment";

      const author = document.createElement("div");
      author.className = "author";
      author.textContent = item.author_name;

      const content = document.createElement("div");
      content.textContent = item.content;

      const date = document.createElement("div");
      date.className = "date";
      date.textContent = new Date(item.created_at).toLocaleString("ru-RU");

      block.append(author, content, date);
      list.appendChild(block);
    });
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    status.textContent = "Отправляем…";

    const author = document.getElementById("author").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!author || !content) {
      status.textContent = "Заполните оба поля.";
      return;
    }

    const { error } = await db.from("comments").insert({
      post_id: postId,
      author_name: author,
      content: content
    });

    if (error) {
      status.textContent = "Не удалось отправить комментарий. Нужно проверить настройки доступа.";
      console.error(error);
      return;
    }

    form.reset();
    status.textContent = "Комментарий опубликован!";
    await loadComments();
  });

  loadComments();
</script>
</body>
</html>
